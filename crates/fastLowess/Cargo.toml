[package]
# Metadata
name = "fastLowess"
version = "4.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

# Documentation and Discovery
description = "High-performance LOWESS (Locally Weighted Scatterplot Smoothing)"
readme = "README.md"
repository = "https://github.com/thisisamirv/lowess-project"
documentation = "https://docs.rs/fastLowess"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

# Build
include = [
    "src/**/*",
    "docs/**/*",
    "assets/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "katex-header.html",
]

[dependencies]
lowess = { path = "../lowess", version = "4.1", features = ["dev"] }
num-traits = { version = "0.2", features = ["libm"] }
ndarray = { version = "0.17", optional = true }
rayon = { version = "1.12", optional = true }
# GLES is enabled only for Android; enabling it on Windows pulls in
# Win32_UI_WindowsAndMessaging and eager mrmsupport.dll imports.
wgpu = { version = "30.0", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "vulkan",
    "wgsl",
    "webgpu",
] }
bytemuck = { version = "1.25", optional = true }
pollster = { version = "1.0", optional = true }
futures-intrusive = { version = "0.5", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30.0", optional = true, default-features = false, features = [
    "gles",
] }

[dev-dependencies]
approx = "0.5"

[features]
default = ["cpu"]
cpu = ["dep:rayon", "dep:ndarray"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:futures-intrusive"]
dev = []

# Document all features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]
