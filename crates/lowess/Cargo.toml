[package]
# Metadata
name = "lowess"
version = "4.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

# Documentation and Discovery
description = "LOWESS (Locally Weighted Scatterplot Smoothing)"
readme = "README.md"
repository = "https://github.com/thisisamirv/lowess-project"
homepage = "https://github.com/thisisamirv/lowess-project"
documentation = "https://docs.rs/lowess"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

# JP: why do assets need to be included into the build? Is this strictly for docs?
# if so then the docs should be compiled with a docs flag this will bloat the install
# unecessarily
# Build
include = [
    "src/**/*",
    "docs/**/*",
    "assets/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "katex-header.html",
]

[dependencies]
num-traits = { version = "0.2", features = ["libm"] }
wide = { version = "1.7", default-features = false }

[dev-dependencies]
approx = "0.5"

[features]
default = ["std"]
std = ["num-traits/std", "wide/std"]
dev = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]
