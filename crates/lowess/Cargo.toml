[package]
# Metadata
name = "lowess"
version = "4.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

# Documentation and Discovery
description = "LOWESS (Locally Weighted Scatterplot Smoothing)"
readme = "README.md"
repository = "https://github.com/thisisamirv/lowess-project"
documentation = "https://docs.rs/lowess"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

# Build
include = [
    "src/**/*",
    "docs/**/*",
    "assets/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "katex-header.html",
]

[dependencies]
num-traits = { version = "0.2", features = ["libm"] }

[dev-dependencies]
approx = "0.5"
ndarray = "0.17"
proc-macro2 = "1.0"
syn = { version = "3.0", features = ["full", "visit"] }

[features]
default = ["std"]
std = ["num-traits/std"]
dev = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]
