# Vendored dependencies configuration
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

# v0 mangling avoids invalid WASM export names with $, <, >
[build]
rustflags = ["-C", "symbol-mangling-version=v0"]

[target.wasm32-unknown-emscripten]
rustflags = ["-C", "symbol-mangling-version=v0"]

# Bare tool names work regardless of Rtools install location (c: vs d: etc.)
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32.static.posix-gcc.exe"
ar = "x86_64-w64-mingw32.static.posix-ar.exe"
