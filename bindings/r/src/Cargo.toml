[package]
name = "rfastlowess"
version = "3.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/lowess-project"
homepage = "https://github.com/thisisamirv/lowess-project"
documentation = "https://thisisamirv.github.io/lowess-project/r/"
rust-version = "1.89"
readme = "README.md"
description = "High-performance LOWESS (Locally Weighted Scatterplot Smoothing)"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

# Build
[dependencies]
fastLowess = { path = "vendor/fastLowess", features = ["dev", "cpu"] }
extendr-api = "0.9"

[lib]
name = "rfastlowess"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = []
dev = []
# Enables the GPU execution backend. Only meaningful when built locally via
# `make -f bindings/r/Makefile WITH_GPU=1` (or the root `make r WITH_GPU=1`),
# which also skips stripping wgpu deps from the vendored fastLowess crate.
# Not used for CRAN/Bioconductor submission builds.
gpu = ["fastLowess/gpu"]

[profile.release]
strip = "symbols"

[workspace]




