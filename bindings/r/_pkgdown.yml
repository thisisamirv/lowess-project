url: https://thisisamirv.github.io/lowess-project/r/
template:
  bootstrap: 5
  bootswatch: flatly

development:
  mode: auto

reference:
  - title: Core LOWESS Interface
    desc: Main R6 classes for LOWESS smoothing.
    contents:
      - rfastlowess-package
      - Lowess
      - StreamingLowess
      - OnlineLowess
  - title: Results and Utilities
    desc: Objects returned by fit methods and helper functions.
    contents:
      - fit
      - process_chunk
      - finalize
      - add_point
      - plot.LowessResult
      - print.Lowess
      - print.LowessResult
      - print.OnlineLowess
      - print.StreamingLowess
  - title: Types
    desc: Helper types for documentation.
    contents:
      - Nullable
  - title: GPU Backend
    desc: Check for and install the optional GPU-accelerated backend.
    contents:
      - gpu_available
      - install_gpu

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/thisisamirv/lowess-project
      aria-label: GitHub
    intro:
      text: Get Started
      href: articles/rfastlowess.html
