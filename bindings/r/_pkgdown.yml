url: https://thisisamirv.github.io/lowess-project/r/
template:
  package: srr
  bootstrap: 5
  bootswatch: flatly

development:
  mode: auto

reference:
  - title: Core LOWESS Interface
    desc: Main S3 classes for LOWESS smoothing.
    contents:
      - Lowess
      - StreamingLowess
      - OnlineLowess
  - title: Results and Utilities
    desc: Objects returned by fit methods and helper functions.
    contents:
      - fit
      - process_chunk
      - finalize
      - add_point
      - plot.LowessResult
      - print.Lowess
      - print.LowessResult
      - print.OnlineLowess
      - print.StreamingLowess
  - title: GPU Backend
    desc: Check for and install the optional GPU-accelerated backend.
    contents:
      - gpu_available
      - install_gpu

articles:
  - title: Introduction
    contents:
      - installation
      - quickstart
      - concepts
  - title: User Guide
    contents:
      - adapter-choice
      - intervals
      - cross-validation
  - title: Weight & Robustness
    contents:
      - kernels
      - robustness
      - scaling
      - custom-weights
  - title: Advanced
    contents:
      - boundary
      - merge
      - gpu-backend
  - title: Use Cases
    contents:
      - use-case-genomics
      - use-case-time-series
      - use-case-real-time
  - title: Performance
    contents:
      - benchmarks

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/thisisamirv/lowess-project
      aria-label: GitHub
    intro:
      text: Get Started
      href: articles/quickstart.html
