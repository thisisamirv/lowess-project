[package]
name = "fastlowess-cpp"
version = "3.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/lowess-project"
homepage = "https://github.com/thisisamirv/lowess-project"
documentation = "https://thisisamirv.github.io/lowess-project/cpp/"
rust-version = "1.89"
readme = "README.md"
description = "High-performance LOWESS (Locally Weighted Scatterplot Smoothing)"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

[lib]
name = "fastlowess_cpp"
crate-type = ["cdylib", "staticlib"]

[dependencies]
fastLowess = { path = "../../crates/fastLowess", version = "3.1", features = [
    "cpu",
    "dev",
] }
libc = "0.2"

[build-dependencies]
cbindgen = "0.29"

[features]
default = []
# Enables the GPU execution backend (requires a Vulkan/Metal/DX12-capable
# GPU driver at runtime, plus linking against the corresponding system
# graphics libraries). Not enabled in prebuilt releases by default; build
# locally with `cargo build --features gpu` to opt in.
gpu = ["fastLowess/gpu"]
