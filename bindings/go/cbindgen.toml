no_includes = true
language = "C"
header = "#include <stddef.h>"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
include = ["GoLowessResult"]
prefix = "fastlowess_"
renaming_overrides_prefixing = true

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "ScreamingSnakeCase"
