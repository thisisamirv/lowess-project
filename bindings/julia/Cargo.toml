[package]
name = "fastlowess-jl"
version = "2.0.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/lowess-project"
homepage = "https://github.com/thisisamirv/lowess-project"
documentation = "https://lowess.readthedocs.io/"
rust-version = "1.89"
readme = "README.md"
description = "High-performance LOWESS (Locally Weighted Scatterplot Smoothing)"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

[dependencies]
fastLowess = { version = "2.0", features = ["dev", "cpu"] }

[lib]
name = "fastlowess_jl"
crate-type = ["cdylib"]

[features]
default = []
# Enables the GPU execution backend (requires a Vulkan/Metal/DX12-capable
# GPU driver at runtime). Not enabled in prebuilt JLL binaries by default;
# build locally with `cargo build --features gpu` to opt in.
gpu = ["fastLowess/gpu"]
