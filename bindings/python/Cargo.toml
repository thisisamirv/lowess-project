[package]
name = "fastLowess-py"
version = "3.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/lowess-project"
homepage = "https://github.com/thisisamirv/lowess-project"
documentation = "https://lowess.readthedocs.io/"
rust-version = "1.89"
readme = "README.md"
description = "High-performance LOWESS (Locally Weighted Scatterplot Smoothing)"
keywords = ["lowess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

[dependencies]
fastLowess = { path = "../../crates/fastLowess", version = "3.1", features = [
    "dev",
    "cpu",
] }
pyo3 = { version = "0.29", features = ["abi3-py38"] }
numpy = "0.29"

[lib]
name = "fastlowess"
crate-type = ["cdylib"]

[features]
default = []
dev = []
# Enables the GPU execution backend (requires a Vulkan/Metal/DX12-capable
# GPU driver at runtime). Not enabled in published wheels by default; build
# locally with `maturin develop --features gpu` to opt in.
gpu = ["fastLowess/gpu"]
