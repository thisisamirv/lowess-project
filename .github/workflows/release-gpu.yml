  # ============================================================================
  # ATTACH WHEELS/LIBRARIES TO THE GITHUB RELEASE (not published elsewhere)
  # ============================================================================
  attach-to-release:
    name: Attach GPU wheels/libraries to GitHub Release
    needs:
      - linux-x86_64
      - macos-x86_64
      - macos-aarch64
      - windows-x86_64
      - linux-aarch64
      - windows-arm64
      - julia-linux-x86_64
      - julia-macos-x86_64
      - julia-macos-aarch64
      - julia-windows-x86_64
      - julia-linux-aarch64
      - cpp-linux-x86_64
      - cpp-macos-x86_64
      - cpp-macos-aarch64
      - cpp-windows-x86_64
      - cpp-linux-arm64
      - cpp-windows-arm64
      - node-linux-x64-gnu
      - node-darwin-x64
      - node-darwin-arm64
      - node-win32-x64-msvc
      - node-linux-x64-musl
      - node-linux-arm64-gnu
      - node-linux-arm64-musl
      - node-linux-arm-gnueabihf
      - node-win32-arm64-msvc
      - r-linux-x86_64
      - r-macos-x86_64
      - r-macos-aarch64
      - r-windows-x86_64
      - go-linux-x86_64
      - go-macos-x86_64
      - go-macos-aarch64
      - go-windows-x86_64
      - go-linux-arm64
      - go-windows-arm64
      - java-linux-x86_64
      - java-macos-x86_64
      - java-macos-aarch64
      - java-windows-x86_64
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # Required to upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gpu-*
          path: dist
          merge-multiple: true

      - name: Ensure the gpu-builds release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GPU_RELEASE_TAG" >/dev/null 2>&1 || gh release create "$GPU_RELEASE_TAG" \
            --title "GPU builds" \
            --notes "Prebuilt GPU-enabled artifacts for every language binding, across all released versions (the source version is embedded in each asset's filename). Fetched automatically by each binding's \`install_gpu()\`/\`installGpu()\` installer — see the GPU Backend guide in each binding's docs. Not meant to be downloaded manually." \
            --prerelease

      - name: Upload wheels and libraries as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GPU_RELEASE_TAG" dist/*.whl dist/*.so dist/*.dylib dist/*.dll dist/*.node dist/*.a --clobber
