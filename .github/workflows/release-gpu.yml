name: Release GPU

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to build from (defaults to the workflow's own ref)"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # GPU artifacts across all versions live in this one perpetual release
  # instead of cluttering each version's own release page. The source
  # version is embedded in every asset's filename instead.
  GPU_RELEASE_TAG: gpu-builds

jobs:
  # ============================================================================
  # BUILD GPU WHEELS - Linux x86_64
  # ============================================================================
  linux-x86_64:
    name: Build Linux x86_64 GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: x86_64
          args: --release --out dist --features gpu
          manylinux: auto

      - name: Rename asset
        working-directory: bindings/python
        shell: bash
        run: |
          for f in dist/*.whl; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed -E 's/^fastlowess-/fastlowess-gpu-/')"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-linux-x86_64
          path: bindings/python/dist

  # ============================================================================
  # BUILD GPU WHEELS - macOS x86_64 (Intel)
  # ============================================================================
  macos-x86_64:
    name: Build macOS x86_64 GPU
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build GPU wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: x86_64
          args: --release --out dist --features gpu

      - name: Rename asset
        working-directory: bindings/python
        shell: bash
        run: |
          for f in dist/*.whl; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed -E 's/^fastlowess-/fastlowess-gpu-/')"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-macos-x86_64
          path: bindings/python/dist

  # ============================================================================
  # BUILD GPU WHEELS - macOS ARM64 (Apple Silicon)
  # ============================================================================
  macos-aarch64:
    name: Build macOS ARM64 GPU
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build GPU wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: aarch64
          args: --release --out dist --features gpu

      - name: Rename asset
        working-directory: bindings/python
        shell: bash
        run: |
          for f in dist/*.whl; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed -E 's/^fastlowess-/fastlowess-gpu-/')"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-macos-aarch64
          path: bindings/python/dist

  # ============================================================================
  # BUILD GPU WHEELS - Windows x86_64
  # ============================================================================
  windows-x86_64:
    name: Build Windows x86_64 GPU
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build GPU wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: x86_64
          args: --release --out dist --features gpu

      - name: Rename asset
        working-directory: bindings/python
        shell: pwsh
        run: |
          Get-ChildItem dist/*.whl | ForEach-Object {
            $newName = $_.Name -replace '^fastlowess-', 'fastlowess-gpu-'
            Rename-Item $_.FullName $newName
          }

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-windows-x86_64
          path: bindings/python/dist

  # ============================================================================
  # BUILD GPU WHEELS - Linux ARM64 (aarch64)
  # ============================================================================
  linux-aarch64:
    name: Build Linux ARM64 GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: aarch64
          args: --release --out dist --interpreter python3.8 --features gpu
          manylinux: auto

      - name: Rename asset
        working-directory: bindings/python
        shell: bash
        run: |
          for f in dist/*.whl; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed -E 's/^fastlowess-/fastlowess-gpu-/')"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-linux-aarch64
          path: bindings/python/dist

  # ============================================================================
  # BUILD GPU WHEELS - Windows ARM64
  # ============================================================================
  windows-arm64:
    name: Build Windows ARM64 GPU
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build GPU wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: aarch64
          args: --release --out dist --features gpu

      - name: Rename asset
        working-directory: bindings/python
        shell: pwsh
        run: |
          Get-ChildItem dist/*.whl | ForEach-Object {
            $newName = $_.Name -replace '^fastlowess-', 'fastlowess-gpu-'
            Rename-Item $_.FullName $newName
          }

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: gpu-wheels-windows-arm64
          path: bindings/python/dist

  # ============================================================================
  # BUILD GPU LIBRARY - Julia (Linux x86_64)
  # ============================================================================
  julia-linux-x86_64:
    name: Build Julia GPU library (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/julia/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep "^version =" bindings/julia/julia/Project.toml | cut -d'"' -f2)
          cp target/release/libfastlowess_jl.so "dist/fastlowess_jl-gpu-v$VERSION-linux-x86_64.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-julia-linux-x86_64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - Julia (macOS x86_64)
  # ============================================================================
  julia-macos-x86_64:
    name: Build Julia GPU library (macOS x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/julia/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep "^version =" bindings/julia/julia/Project.toml | cut -d'"' -f2)
          cp target/release/libfastlowess_jl.dylib "dist/fastlowess_jl-gpu-v$VERSION-macos-x86_64.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-julia-macos-x86_64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - Julia (macOS ARM64)
  # ============================================================================
  julia-macos-aarch64:
    name: Build Julia GPU library (macOS ARM64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/julia/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep "^version =" bindings/julia/julia/Project.toml | cut -d'"' -f2)
          cp target/release/libfastlowess_jl.dylib "dist/fastlowess_jl-gpu-v$VERSION-macos-aarch64.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-julia-macos-aarch64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - Julia (Windows x86_64)
  # ============================================================================
  julia-windows-x86_64:
    name: Build Julia GPU library (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/julia/Cargo.toml

      - name: Rename asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Select-String -Path bindings/julia/julia/Project.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item target/release/fastlowess_jl.dll "dist/fastlowess_jl-gpu-v$version-windows-x86_64.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-julia-windows-x86_64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - Julia (Linux ARM64)
  # ============================================================================
  julia-linux-aarch64:
    name: Build Julia GPU library (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/julia/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep "^version =" bindings/julia/julia/Project.toml | cut -d'"' -f2)
          cp target/release/libfastlowess_jl.so "dist/fastlowess_jl-gpu-v$VERSION-linux-aarch64.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-julia-linux-aarch64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - C++ (Linux x86_64)
  # ============================================================================
  cpp-linux-x86_64:
    name: Build C++ GPU library (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/cpp/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep '^version = ' bindings/cpp/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          cp target/release/libfastlowess_cpp.so "dist/libfastlowess_cpp-gpu-v$VERSION-linux-x86_64.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-cpp-linux-x86_64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - C++ (macOS x86_64)
  # ============================================================================
  cpp-macos-x86_64:
    name: Build C++ GPU library (macOS x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/cpp/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep '^version = ' bindings/cpp/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          cp target/release/libfastlowess_cpp.dylib "dist/libfastlowess_cpp-gpu-v$VERSION-macos-x86_64.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-cpp-macos-x86_64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - C++ (macOS ARM64)
  # ============================================================================
  cpp-macos-aarch64:
    name: Build C++ GPU library (macOS ARM64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/cpp/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep '^version = ' bindings/cpp/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          cp target/release/libfastlowess_cpp.dylib "dist/libfastlowess_cpp-gpu-v$VERSION-macos-aarch64.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-cpp-macos-aarch64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - C++ (Windows x86_64)
  # ============================================================================
  cpp-windows-x86_64:
    name: Build C++ GPU library (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/cpp/Cargo.toml

      - name: Rename asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Select-String -Path bindings/cpp/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item target/release/fastlowess_cpp.dll "dist/libfastlowess_cpp-gpu-v$version-windows-x86_64.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-cpp-windows-x86_64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - C++ (Linux ARM64)
  # ============================================================================
  cpp-linux-arm64:
    name: Build C++ GPU library (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/cpp/Cargo.toml

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep '^version = ' bindings/cpp/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          cp target/release/libfastlowess_cpp.so "dist/libfastlowess_cpp-gpu-v$VERSION-linux-aarch64.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-cpp-linux-arm64
          path: dist

  # ============================================================================
  # BUILD GPU LIBRARY - C++ (Windows ARM64)
  # ============================================================================
  cpp-windows-arm64:
    name: Build C++ GPU library (Windows ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/cpp/Cargo.toml

      - name: Rename asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Select-String -Path bindings/cpp/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item target/release/fastlowess_cpp.dll "dist/libfastlowess_cpp-gpu-v$version-windows-aarch64.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-cpp-windows-arm64
          path: dist

  # ============================================================================
  # BUILD GPU BINARY - Node.js (linux-x64-gnu)
  # ============================================================================
  node-linux-x64-gnu:
    name: Build Node.js GPU binary (linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install --ignore-scripts

      - name: Build GPU binary
        working-directory: bindings/nodejs
        run: npx napi build --release --features gpu

      - name: Rename asset
        working-directory: bindings/nodejs
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp fastlowess.node dist/fastlowess-gpu-v$VERSION.linux-x64-gnu.node

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-node-linux-x64-gnu
          path: bindings/nodejs/dist

  # ============================================================================
  # BUILD GPU BINARY - Node.js (darwin-x64)
  # ============================================================================
  node-darwin-x64:
    name: Build Node.js GPU binary (darwin-x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install --ignore-scripts

      - name: Build GPU binary
        working-directory: bindings/nodejs
        run: npx napi build --release --features gpu

      - name: Rename asset
        working-directory: bindings/nodejs
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp fastlowess.node dist/fastlowess-gpu-v$VERSION.darwin-x64.node

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-node-darwin-x64
          path: bindings/nodejs/dist

  # ============================================================================
  # BUILD GPU BINARY - Node.js (darwin-arm64)
  # ============================================================================
  node-darwin-arm64:
    name: Build Node.js GPU binary (darwin-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install --ignore-scripts

      - name: Build GPU binary
        working-directory: bindings/nodejs
        run: npx napi build --release --features gpu

      - name: Rename asset
        working-directory: bindings/nodejs
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp fastlowess.node dist/fastlowess-gpu-v$VERSION.darwin-arm64.node

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-node-darwin-arm64
          path: bindings/nodejs/dist

  # ============================================================================
  # BUILD GPU BINARY - Node.js (win32-x64-msvc)
  # ============================================================================
  node-win32-x64-msvc:
    name: Build Node.js GPU binary (win32-x64-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install --ignore-scripts

      - name: Build GPU binary
        working-directory: bindings/nodejs
        run: npx napi build --release --features gpu

      - name: Rename asset
        working-directory: bindings/nodejs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = node -p "require('./package.json').version"
          Copy-Item fastlowess.node dist/fastlowess-gpu-v$version.win32-x64-msvc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-node-win32-x64-msvc
          path: bindings/nodejs/dist

  # ============================================================================
  # BUILD GPU BINARY - Node.js (linux-x64-musl)
  # ============================================================================
  node-linux-x64-musl:
    name: Build Node.js GPU binary (linux-x64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install --ignore-scripts

      - name: Build GPU binary
        working-directory: bindings/nodejs
        run: npx napi build --release --target x86_64-unknown-linux-musl --features gpu

      - name: Rename asset
        working-directory: bindings/nodejs
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp fastlowess.node dist/fastlowess-gpu-v$VERSION.linux-x64-musl.node

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-node-linux-x64-musl
          path: bindings/nodejs/dist

  # ============================================================================
  # BUILD GPU BINARY - Node.js (linux-arm64-gnu)
  # ============================================================================
  node-linux-arm64-gnu:
    name: Build Node.js GPU binary (linux-arm64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Cross-Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install --ignore-scripts

      - name: Build GPU binary
        working-directory: bindings/nodejs
        run: npx napi build --release --target aarch64-unknown-linux-gnu --features gpu

      - name: Rename asset
        working-directory: bindings/nodejs
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
