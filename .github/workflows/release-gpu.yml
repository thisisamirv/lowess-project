  go-windows-arm64:
    name: Build Go GPU library (Windows ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      # cgo needs a GNU-flavor C toolchain (MSVC .lib archives aren't
      # cgo-compatible); aarch64-pc-windows-gnu doesn't exist as a Rust
      # target, so this cross-compiles via the gnullvm ABI using
      # llvm-mingw's aarch64-w64-mingw32-clang, matching release-go.yml.
      - name: Install llvm-mingw + Rust target
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-gnullvm
          $ver = "20241030"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\llvm-mingw
          $bin = (Get-ChildItem -Path C:\llvm-mingw -Directory | Select-Object -First 1).FullName + "\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # Linker for this target comes from the repo's root .cargo/config.toml.

      - name: Build GPU library
        run: cargo build --release --features gpu --manifest-path bindings/go/Cargo.toml --target aarch64-pc-windows-gnullvm

      - name: Rename asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Select-String -Path bindings/go/fastlowess/version.go -Pattern 'const version = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item target/aarch64-pc-windows-gnullvm/release/libfastlowess_go.a "dist/libfastlowess_go-gpu-v$version-windows-arm64.a"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-go-windows-arm64
          path: dist

