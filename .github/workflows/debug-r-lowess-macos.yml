name: Debug — R LOWESS macOS property test

# Temporary diagnostic workflow for the macos-latest/R-release-only failure
# in bindings/r/tests/testthat/test-property-lowess.R. Not intended for
# main; scoped to this debug branch only. Delete once the investigation
# concludes.

on:
  push:
    branches: [debug/r-lowess-macos-4626]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  diagnose-macos:
    name: Diagnose (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        r: [release, "4.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-r-lowess-macos-${{ matrix.os }}-r${{ matrix.r }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
          extra-packages: |
            any::devtools
            any::testthat
            any::quickcheck
          needs: check

      - name: Prepare Package Sources
        uses: ./.github/actions/prepare-r-source

      - name: Install Package
        working-directory: bindings/r
        run: Rscript -e "devtools::install(quiet = TRUE, upgrade = FALSE)"

      - name: Run diagnostics
        run: Rscript dev/diagnose_r_lowess_macos.R
