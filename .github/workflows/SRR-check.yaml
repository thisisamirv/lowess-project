name: SRR-check

# Cancel any running job if a new push is made
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["R-CMD-check"]
    types:
      - completed
    branches:
      - main

jobs:
  SRR-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev

      - name: Prepare R package tree
        run: |
          chmod +x bindings/r/configure bindings/r/cleanup
          mkdir -p bindings/r/inst
          {
            echo "Authors and Copyright Holders for Rust Dependencies:"
            echo ""
            (cargo metadata --format-version 1) | \
              jq -r '. as $root | [.packages[] | select(.id as $id | ($root.workspace_members | index($id)) == null)] | unique_by(.name)[] | "Package: \(.name) (\(.version))\nAuthors: \(.authors | join(", "))\nLicense: \(.license // "Unknown")\n" + "-" * 40'
          } > bindings/r/inst/AUTHORS

      - name: Suppress third-party compilation warnings
        run: |
          mkdir -p /tmp/r-cc-wrap ~/.R
          printf '#!/bin/sh\nexec gcc "$@" -w\n'  > /tmp/r-cc-wrap/gcc
          printf '#!/bin/sh\nexec g++ "$@" -w\n'  > /tmp/r-cc-wrap/g++
          chmod +x /tmp/r-cc-wrap/gcc /tmp/r-cc-wrap/g++
          echo "CC    = /tmp/r-cc-wrap/gcc" >> ~/.R/Makevars
          echo "CXX   = /tmp/r-cc-wrap/g++" >> ~/.R/Makevars
          echo "CXX11 = /tmp/r-cc-wrap/g++" >> ~/.R/Makevars
          echo "CXX14 = /tmp/r-cc-wrap/g++" >> ~/.R/Makevars
          echo "CXX17 = /tmp/r-cc-wrap/g++" >> ~/.R/Makevars
          echo "CXX20 = /tmp/r-cc-wrap/g++" >> ~/.R/Makevars

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "BiocManager", "covr"))
          install.packages(c("pkgcheck", "pkgstats", "toml", "visNetwork"), repos = c("https://ropensci.r-universe.dev", "https://cloud.r-project.org"))
          # Install package dependencies including suggests (needed for BiocStyle vignette)
          remotes::install_deps("bindings/r", dependencies = TRUE, repos = c(BiocManager::repositories(), "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Debug Coverage
        run: |
          tryCatch({
            print(covr::package_coverage("bindings/r"))
          }, error = function(e) {
            print(e)
            message("Covr failed to run directly")
          })
        shell: Rscript {0}

      - name: Run pkgcheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          library(pkgcheck)
          library(pkgstats)
          check <- pkgcheck::pkgcheck("bindings/r")
          print(check)
          # Fail if checks don't pass
          if (any(check$checks$error)) stop("pkgcheck failed with errors")
        shell: Rscript {0}
