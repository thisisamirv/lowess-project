name: CI — C++

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASAN_OPTIONS: detect_leaks=0:strict_init_order=1

jobs:
  ci:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Rust GNU (Windows)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Install cppcheck (Windows)
        if: runner.os == 'Windows'
        run: choco install cppcheck -y

      - name: Install cppcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cppcheck

      - name: Install clang-tidy and cppcheck (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap || true
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-${{ matrix.os }}

      - name: Build
        working-directory: bindings/cpp
        run: cargo build --release

      - name: Lint
        working-directory: bindings/cpp
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: make cpp-dev
        run: make cpp-dev

  clangcl:
    name: C++ (windows-latest, clang-cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNU Make (Windows)
        run: choco install make -y
      - name: Install cppcheck (Windows)
        run: |
          winget install --id Cppcheck.Cppcheck --exact --accept-source-agreements --accept-package-agreements
          $cppcheckExe = Get-ChildItem -Path "C:\Program Files\Cppcheck","$env:LOCALAPPDATA\Programs\Cppcheck" -Filter cppcheck.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cppcheckExe) { throw "cppcheck.exe not found after winget install" }
          $cppcheckExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-windows-clangcl
      - name: make cpp-dev (clang-cl toolset)
        run: make cpp-dev CPP_CMAKE_TOOLSET="-T ClangCL"

  clang-linux:
    name: C++ (ubuntu-latest, clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install clang and cppcheck
        run: sudo apt-get install -y --no-install-recommends clang cppcheck
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-clang-linux
      - name: make cpp-dev
        run: make cpp-dev

  # Native MinGW-w64 (not the Rtools cross-compiler pinned in the workspace
  # .cargo/config.toml for the R binding, which lacks libgcc_eh — see docs/NEWS.md).
  mingw:
    name: C++ (windows-latest, MinGW-w64)
    runs-on: windows-latest
    continue-on-error: true
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_AR: gcc-ar
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install GNU Make (Windows)
        run: choco install make -y
      - name: Install native MinGW-w64
        run: |
          choco install mingw -y
          $gcc = Get-ChildItem -Path "C:\ProgramData\mingw64","C:\ProgramData\chocolatey\lib\mingw","C:\tools\mingw64" -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found after choco install mingw" }
          $gcc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install cppcheck (Windows)
        run: |
          winget install --id Cppcheck.Cppcheck --exact --accept-source-agreements --accept-package-agreements
          $cppcheckExe = Get-ChildItem -Path "C:\Program Files\Cppcheck","$env:LOCALAPPDATA\Programs\Cppcheck" -Filter cppcheck.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cppcheckExe) { throw "cppcheck.exe not found after winget install" }
          $cppcheckExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-windows-mingw
      - name: make cpp-dev
        run: make cpp-dev CPP_WIN_TOOLCHAIN=mingw

  # Intel oneAPI C++ compiler (icpx) as a consumer of the C ABI header. Only
  # exercises the test harness build, not the Rust cdylib itself.
  # Non-blocking: the multi-GB apt package can be slow/flaky in CI.
  intel-oneapi:
    name: C++ (ubuntu-latest, Intel oneAPI)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-intel-oneapi
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Install Intel oneAPI C++ compiler
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
      - name: make cpp-dev (icpx)
        env:
          CC: icx
          CXX: icpx
        run: |
          source /opt/intel/oneapi/setvars.sh
          make cpp-dev

  asan:
    name: C++ ASAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-asan
      - name: Install System Dependencies
        run: sudo apt-get install -y --no-install-recommends clang lld cmake g++
      - name: Build (ASAN)
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo build \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fastlowess-cpp --release
      - name: Prepare sanitized library
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/libfastlowess_cpp.so target/release/
      - name: C++ Tests (ASAN)
        run: |
          cmake -S bindings/cpp/tests -B bindings/cpp/tests/build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address' \
            -DFASTLOWESS_LIB_DIR="$(pwd)/target/release"
          cmake --build bindings/cpp/tests/build-asan --config Debug
          LD_LIBRARY_PATH=target/release \
            ctest --test-dir bindings/cpp/tests/build-asan --output-on-failure

  gpu:
    name: C++ GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-gpu
      - uses: ./.github/actions/setup-lavapipe
      - name: Build with GPU feature
        working-directory: bindings/cpp
        run: cargo build --release --features gpu
      - name: GPU smoke test
        run: |
          cat > /tmp/gpu_smoke.cpp <<'CPP'
          #include "fastlowess.hpp"
          #include <cmath>
          #include <cstdio>
          #include <vector>
          int main() {
            if (!fastlowess::gpu::available()) { std::fprintf(stderr, "GPU not detected\n"); return 1; }
            constexpr std::size_t n = 50;
            std::vector<double> x(n), y(n);
            for (std::size_t i = 0; i < n; ++i) {
              x[i] = static_cast<double>(i) / (n - 1);
              y[i] = std::sin(6.0 * x[i]) + 0.05;
            }
            fastlowess::LowessOptions opts;
            opts.fraction = 0.3;
            opts.backend = "gpu";
            auto result = fastlowess::Lowess(opts).fit(x, y);
            if (!result.has_value()) { std::fprintf(stderr, "fit failed: %s\n", result.error().c_str()); return 1; }
            auto yf = result.value().y_vector();
            if (yf.size() != n) { std::fprintf(stderr, "bad output length\n"); return 1; }
            for (double v : yf) if (!std::isfinite(v)) { std::fprintf(stderr, "non-finite\n"); return 1; }
            std::printf("C++ GPU OK\n");
          }
          CPP
          g++ -O3 -std=c++17 /tmp/gpu_smoke.cpp -o /tmp/gpu_smoke \
            -I"${GITHUB_WORKSPACE}/bindings/cpp/include" \
            -L"${GITHUB_WORKSPACE}/target/release" \
            -lfastlowess_cpp -lpthread -ldl -lm
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/release" /tmp/gpu_smoke
