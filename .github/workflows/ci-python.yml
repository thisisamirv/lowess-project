name: CI — Python

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASAN_OPTIONS: detect_leaks=0:strict_init_order=1

jobs:
  ci:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install GNU Make (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}

      - name: Build & Install
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy ruff matplotlib
          pip install .

      - name: Lint (Ruff)
        working-directory: bindings/python
        run: |
          ruff format --check python/fastlowess/ tests/
          ruff check python/fastlowess/ tests/

      - name: Test
        working-directory: bindings/python
        run: pytest tests/ -v

      - name: make python-dev
        run: make python-dev

  asan:
    name: Python ASAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-asan
      - name: Install System Dependencies
        run: sudo apt-get install -y --no-install-recommends clang lld
      - name: Build (ASAN)
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo build \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fastLowess-py --release

  gpu:
    name: Python GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-gpu
      - uses: ./.github/actions/setup-lavapipe
      - name: Build with GPU feature
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy
          maturin build --release --features gpu -o dist
          pip install --force-reinstall dist/*.whl
      - name: GPU smoke test
        run: |
          cat > /tmp/gpu_smoke.py <<'PY'
          import fastlowess as fl
          import numpy as np
          assert fl.gpu_available(), "GPU backend not detected"
          x = np.linspace(0, 1, 50)
          y = np.sin(6 * x) + 0.05
          result = fl.Lowess(fraction=0.3, backend="gpu").fit(x, y)
          assert len(result.y) == len(x)
          assert np.all(np.isfinite(result.y))
          print("Python GPU OK")
          PY
          python /tmp/gpu_smoke.py
