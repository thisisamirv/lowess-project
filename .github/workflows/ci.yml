      - name: "R: Install runtime dependencies"
        if: matrix.language == 'r'
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"));
            if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager", quiet = TRUE);
            if (!requireNamespace("BiocGenerics", quietly = TRUE)) BiocManager::install("BiocGenerics", ask = FALSE, update = FALSE, quiet = TRUE)
          '

      - name: "R: Build and install with GPU feature"
        if: matrix.language == 'r'
        working-directory: benchmarks
        run: make WITH_GPU=1 install

      - name: "R: GPU smoke test"
        if: matrix.language == 'r'
        run: |
          cat > /tmp/gpu_smoke.R <<'R'
          library(rfastlowess)

          stopifnot(gpu_available())

          x <- seq(0, 1, length.out = 50)
          y <- sin(6 * x) + 0.05

          model <- Lowess(fraction = 0.3, backend = "gpu")
          result <- fit(model, x, y)

          stopifnot(length(result$y) == length(x))
          stopifnot(all(is.finite(result$y)))
          cat("R GPU backend OK\n")
          R
          Rscript /tmp/gpu_smoke.R
