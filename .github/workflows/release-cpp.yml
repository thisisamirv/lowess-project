name: Release C++

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload assets to (e.g., v0.99.8)"
        required: true
        type: string
      commit:
        description: "Commit SHA to build from (defaults to the workflow's own ref)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.os }}${{ matrix.container && ' (musl)' || '' }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-x64.so
            platform_dir: linux-x64
            target_dir: target/release
          - os: ubuntu-latest
            container: "alpine:latest"
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-x64-musl.so
            platform_dir: linux-x64-musl
            target_dir: target/release
          - os: ubuntu-24.04-arm
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-arm64.so
            platform_dir: linux-arm64
            target_dir: target/release
          - os: ubuntu-24.04-arm
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-arm64-musl.so
            platform_dir: linux-arm64-musl
            target_dir: target/aarch64-unknown-linux-musl/release
            cargo_target: "--target aarch64-unknown-linux-musl"
            rust_target: aarch64-unknown-linux-musl
            linux_musl: true
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-x86.so
            platform_dir: linux-x86
            target_dir: target/i686-unknown-linux-gnu/release
            cargo_target: "--target i686-unknown-linux-gnu"
            rust_target: i686-unknown-linux-gnu
            cross_packages: gcc-i686-linux-gnu
            cross_linker_env: CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER
            cross_linker: i686-linux-gnu-gcc
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-armv7.so
            platform_dir: linux-armv7
            target_dir: target/armv7-unknown-linux-gnueabihf/release
            cargo_target: "--target armv7-unknown-linux-gnueabihf"
            rust_target: armv7-unknown-linux-gnueabihf
            cross_packages: gcc-arm-linux-gnueabihf
            cross_linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            cross_linker: arm-linux-gnueabihf-gcc
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-android-arm64-v8a.so
            platform_dir: android-arm64-v8a
            target_dir: target/aarch64-linux-android/release
            cargo_target: "--target aarch64-linux-android"
            rust_target: aarch64-linux-android
            android_abi: arm64-v8a
            android_linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            android_linker: aarch64-linux-android21-clang
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-android-armeabi-v7a.so
            platform_dir: android-armeabi-v7a
            target_dir: target/armv7-linux-androideabi/release
            cargo_target: "--target armv7-linux-androideabi"
            rust_target: armv7-linux-androideabi
            android_abi: armeabi-v7a
            android_linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
            android_linker: armv7a-linux-androideabi21-clang
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-android-x86.so
            platform_dir: android-x86
            target_dir: target/i686-linux-android/release
            cargo_target: "--target i686-linux-android"
            rust_target: i686-linux-android
            android_abi: x86
            android_linker_env: CARGO_TARGET_I686_LINUX_ANDROID_LINKER
            android_linker: i686-linux-android21-clang
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-android-x86_64.so
            platform_dir: android-x86_64
            target_dir: target/x86_64-linux-android/release
            cargo_target: "--target x86_64-linux-android"
            rust_target: x86_64-linux-android
            android_abi: x86_64
            android_linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            android_linker: x86_64-linux-android21-clang
          - os: windows-latest
            artifact_name: fastlowess.dll
            asset_name: fastlowess-win32-x64.dll
            platform_dir: windows-x64-msvc
            import_library_asset_name: fastlowess-win32-x64.lib
            windows_toolchain: msvc
            target_dir: target/release
          - os: windows-latest
            artifact_name: fastlowess.dll
            asset_name: fastlowess-win32-x64-gnu.dll
            platform_dir: windows-x64-gnu
            import_library_asset_name: libfastlowess-win32-x64-gnu.dll.a
            windows_toolchain: gnu
            target_dir: target/x86_64-pc-windows-gnu/release
            cargo_target: "--target x86_64-pc-windows-gnu"
            rust_target: x86_64-pc-windows-gnu
          - os: windows-11-arm
            artifact_name: fastlowess.dll
            asset_name: fastlowess-win32-arm64.dll
            platform_dir: windows-arm64
            import_library_asset_name: fastlowess-win32-arm64.lib
            windows_toolchain: msvc
            target_dir: target/release
          - os: macos-15-intel
            artifact_name: libfastlowess.dylib
            asset_name: libfastlowess-macos-x64.dylib
            platform_dir: macos-x64
            target_dir: target/release
          - os: macos-latest
            artifact_name: libfastlowess.dylib
            asset_name: libfastlowess-macos-arm64.dylib
            platform_dir: macos-arm64
            target_dir: target/release
          - os: macos-latest
            artifact_name: libfastlowess_cpp.a
            asset_name: libfastlowess-ios-arm64.a
            platform_dir: ios-arm64
            target_dir: target/aarch64-apple-ios/release
            cargo_target: "--target aarch64-apple-ios"
            rust_target: aarch64-apple-ios
            static_library: true
          - os: macos-latest
            artifact_name: libfastlowess_cpp.a
            asset_name: libfastlowess-ios-simulator-arm64.a
            platform_dir: ios-simulator-arm64
            target_dir: target/aarch64-apple-ios-sim/release
            cargo_target: "--target aarch64-apple-ios-sim"
            rust_target: aarch64-apple-ios-sim
            static_library: true
          - os: macos-latest
            artifact_name: libfastlowess_cpp.a
            asset_name: libfastlowess-ios-simulator-x86_64.a
            platform_dir: ios-simulator-x86_64
            target_dir: target/x86_64-apple-ios/release
            cargo_target: "--target x86_64-apple-ios"
            rust_target: x86_64-apple-ios
            static_library: true

    steps:
      - name: Install Alpine build dependencies
        if: matrix.container
        run: |
          apk add --no-cache build-base curl bash git
          # Alpine's Rust host triple (x86_64-unknown-linux-musl) defaults to
          # fully-static crt, which cannot emit a `cdylib`. Disable crt-static so
          # the .so links dynamically against Alpine's musl (the release asset is
          # the cdylib, so it must not be silently dropped for this target).
          echo "RUSTFLAGS=-C target-feature=-crt-static" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cross-compilation Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux cross compiler
        if: matrix.cross_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }}
          echo "${{ matrix.cross_linker_env }}=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        if: matrix.android_abi != ''
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and configure linker
        if: matrix.android_abi != ''
        shell: bash
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${{ matrix.android_linker_env }}=$NDK_BIN/${{ matrix.android_linker }}" >> "$GITHUB_ENV"

      - name: Install MinGW-w64
        if: matrix.windows_toolchain == 'gnu'
        run: |
          choco install mingw -y
          $gcc = Get-ChildItem -Path "C:\ProgramData\mingw64","C:\ProgramData\chocolatey\lib\mingw","C:\tools\mingw64" -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found after choco install mingw" }
          $gcc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_AR=gcc-ar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install musl toolchain + target (Linux aarch64 musl)
        if: matrix.linux_musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          # The default static-musl target drops the `cdylib` crate type (a
          # fully-static build has no dynamic library to emit), which would
          # silently produce no `.so`. Disable crt-static so musl-gcc links a
          # dynamic library, matching the Alpine-based x64 musl build.
          # Disabling crt-static also makes rustc request dynamic `-lgcc_s`,
          # but musl-gcc's specs (`-nodefaultlibs`) don't add the system gcc's
          # lib dir to the linker search path, so point at it explicitly
          # (statically linking libgcc doesn't help: rustc passes `-lgcc_s`
          # itself, which only resolves against a `-L`'d libgcc_s.so.1).
          LIBGCC_DIR="$(dirname "$(ldconfig -p | grep libgcc_s.so.1 | awk '{print $NF}' | head -n1)")"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=-crt-static -L $LIBGCC_DIR" >> "$GITHUB_ENV"

      - name: Build C++ Library
        working-directory: bindings/cpp
        run: cargo build --locked --release --lib ${{ matrix.cargo_target }}

      - name: Prepare Assets (iOS static library)
        if: matrix.static_library == true
        run: mv ${{ matrix.target_dir }}/libfastlowess_cpp.a ${{ matrix.asset_name }}

      - name: Prepare Assets (Unix)
        if: runner.os != 'Windows' && matrix.static_library != true
        run: |
          # Rust/Cargo naming: libfastlowess_cpp.so or .dylib
          mv ${{ matrix.target_dir }}/libfastlowess_cpp.so ${{ matrix.asset_name }} 2>/dev/null || mv ${{ matrix.target_dir }}/libfastlowess_cpp.dylib ${{ matrix.asset_name }}

      - name: Prepare Assets (Windows)
        if: runner.os == 'Windows' && matrix.windows_toolchain == 'msvc'
        shell: bash
        run: |
          # Windows: fastlowess_cpp.dll
          mv ${{ matrix.target_dir }}/fastlowess_cpp.dll ${{ matrix.asset_name }}
          mv ${{ matrix.target_dir }}/fastlowess_cpp.dll.lib ${{ matrix.import_library_asset_name }}

      - name: Prepare Assets (Windows MinGW)
        if: runner.os == 'Windows' && matrix.windows_toolchain == 'gnu'
        shell: bash
        run: |
          mv ${{ matrix.target_dir }}/fastlowess_cpp.dll ${{ matrix.asset_name }}
          mv ${{ matrix.target_dir }}/libfastlowess_cpp.dll.a ${{ matrix.import_library_asset_name }}

      - name: Assemble platform package
        shell: bash
        run: |
          package_dir="package/${{ matrix.platform_dir }}"
          mkdir -p "$package_dir"
          cp "${{ matrix.asset_name }}" "$package_dir/"
          if [ -n "${{ matrix.import_library_asset_name }}" ]; then
            cp "${{ matrix.import_library_asset_name }}" "$package_dir/"
          fi
          cp bindings/cpp/include/fastlowess.hpp "$package_dir/"
          cp bindings/cpp/include/fastlowess.h "$package_dir/"
          cp bindings/cpp/include/fastlowess_version.h "$package_dir/"

      - name: Upload platform package artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp-${{ matrix.platform_dir }}
          path: package/${{ matrix.platform_dir }}
          if-no-files-found: error

  package-and-upload:
    name: Package and upload C++ release archive
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate dependency license report
        run: |
          mkdir -p release-packages
          cargo about generate \
            --manifest-path bindings/cpp/Cargo.toml \
            --locked \
            --config dev/about.toml \
            dev/about.hbs \
            --output-file release-packages/THIRD_PARTY_LICENSES.html

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create and validate platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-packages
          shopt -s nullglob
          for artifact_dir in artifacts/cpp-*; do
            [ -d "$artifact_dir" ] || continue
            cp release-packages/THIRD_PARTY_LICENSES.html "$artifact_dir/"
          done
          package_count=0
          for artifact_dir in artifacts/cpp-*; do
            [ -d "$artifact_dir" ] || continue
            platform="${artifact_dir#artifacts/cpp-}"
            for header in fastlowess.hpp fastlowess.h fastlowess_version.h; do
              test -f "$artifact_dir/$header"
            done
            test -f "$artifact_dir/THIRD_PARTY_LICENSES.html"
            find "$artifact_dir" -maxdepth 1 -type f | grep -Eq '\.(so|dylib|dll|a)$'
            archive="release-packages/libfastlowess-${platform}.tar"
            files=("$artifact_dir"/*)
            tar -cf "$archive" -C "$artifact_dir" "${files[@]##*/}"
            for header in fastlowess.hpp fastlowess.h fastlowess_version.h; do
              tar -tf "$archive" | grep -Fxq "$header"
            done
            tar -tf "$archive" | grep -Fxq THIRD_PARTY_LICENSES.html
            package_count=$((package_count + 1))
          done
          test "$package_count" -eq 18

      - name: Upload platform archives to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            release-packages/*.tar
            release-packages/THIRD_PARTY_LICENSES.html

  spack-release:
    name: Update Spack recipe
    runs-on: ubuntu-latest
    steps:
      # release/workflow_dispatch events check out a detached HEAD at the
      # release tag by default; check out the default branch instead so the
      # "Commit updated recipe" step below has something to push to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine version and sha256
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "Downloading $URL to compute sha256..."
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256: $SHA256"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update package.py with new version + sha256
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          PACKAGE_FILE: bindings/cpp/spack/package.py
        run: |4
            python - <<'PY'
            import os
            import re
            from pathlib import Path

            package_file = Path(os.environ["PACKAGE_FILE"])
            version = os.environ["VERSION"]
            sha256 = os.environ["SHA256"]
            contents = package_file.read_text(encoding="utf-8")
            version_pattern = re.compile(
              rf'(?m)^[ \t]*version\(\s*["\']{re.escape(version)}["\']'
              r'\s*,\s*sha256=["\'][0-9a-fA-F]+["\']\s*,?\s*\)'
            )
            matches = list(version_pattern.finditer(contents))
            declaration = f'version("{version}", sha256="{sha256}")'

            if matches:
              updated = []
              previous_end = 0
              for index, match in enumerate(matches):
                updated.append(contents[previous_end : match.start()])
                if index == 0:
                  updated.append(f"    {declaration}")
                previous_end = match.end()
              updated.append(contents[previous_end:])
              contents = "".join(updated)
            else:
              anchor = "# spack-release job on every release; keep newest first."
              if anchor not in contents:
                raise SystemExit(f"Could not find version insertion point in {package_file}")
              contents = contents.replace(anchor, f'{anchor}\n    {declaration}', 1)

            package_file.write_text(contents, encoding="utf-8")
            PY
            echo "Updated $PACKAGE_FILE with version $VERSION"

      - name: Commit updated recipe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f: the repo's .gitignore has a blanket `spack/` rule (for
          # Spack's own build caches elsewhere) that also matches this
          # directory name, even though this recipe file is tracked.
          git add -f bindings/cpp/spack/package.py
          git commit -m "cpp: update Spack recipe for ${{ github.event.release.tag_name || github.event.inputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Check Spack fork exists
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if gh repo view "$OWNER/spack-packages" > /dev/null 2>&1; then
            echo "✅ Fork exists: $OWNER/spack-packages"
          else
            echo "⚠️ Fork does not exist. Forking..."
            gh repo fork spack/spack-packages --clone=false
            sleep 10
          fi

      - name: Clone Spack fork
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/spack-packages.git" spack-fork
          cd spack-fork
          git remote add upstream https://github.com/spack/spack-packages.git
          git fetch upstream develop
          git checkout develop
          git reset --hard upstream/develop
          git push origin develop --force
          echo "✅ Fork synced with upstream"

      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BRANCH="fastlowess-cpp-$VERSION"
          EXISTING_PR=$(gh pr list \
            --repo spack/spack-packages \
            --head "$OWNER:$BRANCH" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "⚠️ PR #$EXISTING_PR already exists for v$VERSION"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No existing PR found for v$VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BRANCH="fastlowess-cpp-$VERSION"
          cd spack-fork
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          mkdir -p repos/spack_repo/builtin/packages/fastlowess_cpp
          cp ../bindings/cpp/spack/package.py repos/spack_repo/builtin/packages/fastlowess_cpp/package.py
          git add repos/spack_repo/builtin/packages/fastlowess_cpp/package.py

          if git diff --cached --quiet; then
            echo "No changes for fastlowess-cpp $VERSION; skipping PR."
            exit 0
          fi

          git commit -m "fastlowess-cpp: add v$VERSION"
          git push --force origin "$BRANCH"

          gh pr create \
            --repo spack/spack-packages \
            --head "${OWNER}:${BRANCH}" \
            --base develop \
            --title "fastlowess-cpp: add v$VERSION" \
            --body "Adds version $VERSION of \`fastlowess-cpp\`. Recipe is maintained upstream at the package's own repository and mirrored here automatically on each release." ||
            echo "PR creation failed or a PR already exists for branch $BRANCH; check spack/spack-packages pull requests."
