name: Release C++

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload assets to (e.g., v0.99.8)"
        required: true
        type: string
      commit:
        description: "Commit SHA to build from (defaults to the workflow's own ref)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-x64.so
            target_dir: target/release
          - os: ubuntu-24.04-arm
            artifact_name: libfastlowess.so
            asset_name: libfastlowess-linux-arm64.so
            target_dir: target/release
          - os: windows-latest
            artifact_name: fastlowess.dll
            asset_name: fastlowess-win32-x64.dll
            target_dir: target/release
          - os: windows-11-arm
            artifact_name: fastlowess.dll
            asset_name: fastlowess-win32-arm64.dll
            target_dir: target/release
          - os: macos-15-intel
            artifact_name: libfastlowess.dylib
            asset_name: libfastlowess-macos-x64.dylib
            target_dir: target/release
          - os: macos-latest
            artifact_name: libfastlowess.dylib
            asset_name: libfastlowess-macos-arm64.dylib
            target_dir: target/release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build C++ Library
        working-directory: bindings/cpp
        run: cargo build --release --lib

      - name: Prepare Assets (Unix)
        if: runner.os != 'Windows'
        run: |
          # Rust/Cargo naming: libfastlowess_cpp.so or .dylib
          mv target/release/libfastlowess_cpp.so ${{ matrix.asset_name }} 2>/dev/null || mv target/release/libfastlowess_cpp.dylib ${{ matrix.asset_name }}

      - name: Prepare Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows: fastlowess_cpp.dll
          mv target/release/fastlowess_cpp.dll ${{ matrix.asset_name }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: ${{ matrix.asset_name }}

      - name: Upload Header to Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: bindings/cpp/include/fastlowess.hpp

  spack-release:
    name: Update Spack recipe
    runs-on: ubuntu-latest
    steps:
      # release/workflow_dispatch events check out a detached HEAD at the
      # release tag by default; check out the default branch instead so the
      # "Commit updated recipe" step below has something to push to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine version and sha256
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "Downloading $URL to compute sha256..."
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256: $SHA256"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update package.py with new version + sha256
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          PACKAGE_FILE: bindings/cpp/spack/package.py
        run: |
          if grep -qE "version\(\"${VERSION}\"" "$PACKAGE_FILE"; then
            # Refresh the sha256 of an already-present version() line in place.
            sed -i -E "s/version\(\"${VERSION}\", sha256=\"[0-9a-f]+\"\)/version(\"${VERSION}\", sha256=\"${SHA256}\")/" "$PACKAGE_FILE"
          else
            # Insert a new version() line right after the anchor comment,
            # keeping Spack's newest-first convention.
            sed -i "/# spack-release job on every release; keep newest first\\./a\\    version(\"${VERSION}\", sha256=\"${SHA256}\")" "$PACKAGE_FILE"
          fi
          echo "Updated $PACKAGE_FILE with version $VERSION"

      - name: Commit updated recipe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/cpp/spack/package.py
          git commit -m "cpp: update Spack recipe for ${{ github.event.release.tag_name || github.event.inputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Check Spack fork exists
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if gh repo view "$OWNER/spack-packages" > /dev/null 2>&1; then
            echo "✅ Fork exists: $OWNER/spack-packages"
          else
            echo "⚠️ Fork does not exist. Forking..."
            gh repo fork spack/spack-packages --clone=false
            sleep 10
          fi

      - name: Clone Spack fork
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/spack-packages.git" spack-fork
          cd spack-fork
          git remote add upstream https://github.com/spack/spack-packages.git
          git fetch upstream develop
          git checkout develop
          git reset --hard upstream/develop
          git push origin develop --force
          echo "✅ Fork synced with upstream"

      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BRANCH="fastlowess-cpp-$VERSION"
          EXISTING_PR=$(gh pr list \
            --repo spack/spack-packages \
            --head "$OWNER:$BRANCH" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "⚠️ PR #$EXISTING_PR already exists for v$VERSION"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No existing PR found for v$VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BRANCH="fastlowess-cpp-$VERSION"
          cd spack-fork
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          mkdir -p repos/spack_repo/builtin/packages/fastlowess_cpp
          cp ../bindings/cpp/spack/package.py repos/spack_repo/builtin/packages/fastlowess_cpp/package.py
          git add repos/spack_repo/builtin/packages/fastlowess_cpp/package.py

          if git diff --cached --quiet; then
            echo "No changes for fastlowess-cpp $VERSION; skipping PR."
            exit 0
          fi

          git commit -m "fastlowess-cpp: add v$VERSION"
          git push --force origin "$BRANCH"

          gh pr create \
            --repo spack/spack-packages \
            --head "${OWNER}:${BRANCH}" \
            --base develop \
            --title "fastlowess-cpp: add v$VERSION" \
            --body "Adds version $VERSION of \`fastlowess-cpp\`. Recipe is maintained upstream at the package's own repository and mirrored here automatically on each release." ||
            echo "PR creation failed or a PR already exists for branch $BRANCH; check spack/spack-packages pull requests."
