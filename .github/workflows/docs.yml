name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "bindings/cpp/**"
      - "bindings/go/**"
      - "bindings/java/**"
      - "bindings/julia/**"
      - "bindings/nodejs/**"
      - "bindings/r/**"
      - "bindings/wasm/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.f.outputs.root }}
      cpp: ${{ steps.f.outputs.cpp }}
      go: ${{ steps.f.outputs.go }}
      java: ${{ steps.f.outputs.java }}
      julia: ${{ steps.f.outputs.julia }}
      nodejs: ${{ steps.f.outputs.nodejs }}
      r: ${{ steps.f.outputs.r }}
      wasm: ${{ steps.f.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            root:
              - 'README.md'
              - '.github/workflows/docs.yml'
            cpp:
              - 'bindings/cpp/**'
              - '.github/workflows/docs.yml'
            go:
              - 'bindings/go/**'
              - '.github/workflows/docs.yml'
            java:
              - 'bindings/java/**'
              - '.github/workflows/docs.yml'
            julia:
              - 'bindings/julia/**'
              - '.github/workflows/docs.yml'
            nodejs:
              - 'bindings/nodejs/**'
              - '.github/workflows/docs.yml'
            r:
              - 'bindings/r/**'
              - '.github/workflows/docs.yml'
            wasm:
              - 'bindings/wasm/**'
              - '.github/workflows/docs.yml'

  # Each of the jobs below only builds its own docs and uploads the result as a
  # workflow artifact — nothing is pushed to gh-pages here. This lets them all
  # run in parallel, and keeps GitHub's own "pages build and deployment" from
  # firing once per job. The `deploy` job merges every artifact into a single
  # commit at the end, so the branch (and its auto-triggered Pages build) is
  # only touched once per workflow run.

  root:
    needs: filter
    if: needs.filter.outputs.root == 'true' || github.event_name == 'workflow_dispatch'
    name: Root — README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc
        run: sudo apt-get install -y pandoc
      - name: Convert README.md to HTML
        run: |
          mkdir -p _site
          pandoc README.md \
            --from=gfm \
            --to=html5 \
            --standalone \
            --metadata title="${{ github.event.repository.name }}" \
            --css=https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown-light.min.css \
            -o _site/index.html
          sed -i 's|<body>|<body class="markdown-body" style="max-width:980px;margin:0 auto;padding:45px">|' _site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-root
          path: _site
          retention-days: 1

  cpp:
    needs: filter
    if: needs.filter.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch'
    name: C++ — Doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Build docs
        run: doxygen Doxyfile
        working-directory: bindings/cpp

      - uses: actions/upload-artifact@v7
        with:
          name: docs-cpp
          path: bindings/cpp/html
          retention-days: 1

  go:
    needs: filter
    if: needs.filter.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    name: Go — Hugo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"

      - name: Install Hugo
        run: go install github.com/gohugoio/hugo@v0.165.0

      - name: Build docs
        run: hugo --gc --minify
        working-directory: bindings/go/docs-site

      - uses: actions/upload-artifact@v7
        with:
          name: docs-go
          path: bindings/go/docs-site/public
          retention-days: 1

  java:
    needs: filter
    if: needs.filter.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    name: Java — Hugo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"

      - name: Install Hugo
        run: go install github.com/gohugoio/hugo@v0.165.0

      - name: Embed README as homepage
        run: python3 dev/add-readme-to-docs.py bindings/java

      - name: Build docs
        run: hugo --gc --minify
        working-directory: bindings/java/docs-site

      - uses: actions/upload-artifact@v7
        with:
          name: docs-java
          path: bindings/java/docs-site/public
          retention-days: 1

  julia:
    needs: filter
    if: needs.filter.outputs.julia == 'true' || github.event_name == 'workflow_dispatch'
    name: Julia — Documenter.jl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - uses: julia-actions/cache@v3

      - name: Relax JLL dependency for docs build
        uses: ./.github/actions/relax-julia-jll

      - name: Install docs dependencies
        run: |
          julia --project=bindings/julia/julia/docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = "bindings/julia/julia"))
            Pkg.instantiate()
          '

      - name: Build docs
        run: julia --project=bindings/julia/julia/docs bindings/julia/julia/docs/make.jl

      - uses: actions/upload-artifact@v7
        with:
          name: docs-julia
          path: bindings/julia/julia/docs/build
          retention-days: 1

  nodejs:
    needs: filter
    if: needs.filter.outputs.nodejs == 'true' || github.event_name == 'workflow_dispatch'
    name: Node.js — Starlight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-nodejs

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: bindings/nodejs

      - name: Build native addon
        run: npm run build
        working-directory: bindings/nodejs

      - name: Build docs
        run: npm run docs
        working-directory: bindings/nodejs
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          VITE_BASE: /${{ github.event.repository.name }}/nodejs/

      - uses: actions/upload-artifact@v7
        with:
          name: docs-nodejs
          path: bindings/nodejs/dist
          retention-days: 1

  r:
    needs: filter
    if: needs.filter.outputs.r == 'true' || github.event_name == 'workflow_dispatch'
    name: R — pkgdown
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-r-pkgdown

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
          extra-packages: any::pkgdown any::devtools

      - uses: ./.github/actions/prepare-r-source

      - name: Build pkgdown site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(pkg = "bindings/r", new_process = FALSE, install = TRUE)

      - uses: actions/upload-artifact@v7
        with:
          name: docs-r
          path: bindings/r/docs
          retention-days: 1

  wasm:
    needs: filter
    if: needs.filter.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
    name: WebAssembly — Starlight
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-wasm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build WASM
        run: wasm-pack build --target nodejs --release
        working-directory: bindings/wasm

      - name: Install dependencies
        run: npm install
        working-directory: bindings/wasm

      - name: Build docs
        run: npm run docs
        working-directory: bindings/wasm
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          VITE_BASE: /${{ github.event.repository.name }}/wasm/

      - uses: actions/upload-artifact@v7
        with:
          name: docs-wasm
          path: bindings/wasm/dist
          retention-days: 1

  build:
    needs: [filter, root, cpp, go, java, julia, nodejs, r, wasm]
    if: always()
    name: Build — merge & cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout existing gh-pages content
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: _site

      - name: Drop nested git metadata from the gh-pages checkout
        run: |
          mkdir -p _site
          rm -rf _site/.git

      - name: Download root artifact
        if: needs.filter.outputs.root == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-root
          path: _site

      - name: Download cpp artifact
        if: needs.filter.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-cpp
          path: _site/cpp

      - name: Download go artifact
        if: needs.filter.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-go
          path: _site/go

      - name: Download java artifact
        if: needs.filter.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-java
          path: _site/java

      - name: Download julia artifact
        if: needs.filter.outputs.julia == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-julia
          path: _site/julia

      - name: Download nodejs artifact
        if: needs.filter.outputs.nodejs == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-nodejs
          path: _site/nodejs

      - name: Download r artifact
        if: needs.filter.outputs.r == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-r
          path: _site/r

      - name: Download wasm artifact
        if: needs.filter.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-wasm
          path: _site/wasm

      - name: Ensure .nojekyll
        run: touch _site/.nojekyll

      # Kept as a merge cache for future incremental runs (partial rebuilds
      # read prior languages' output from this branch); no longer the
      # Pages source itself once repo settings use "GitHub Actions" deployment.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: .
          clean: false

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    name: Deploy — GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
